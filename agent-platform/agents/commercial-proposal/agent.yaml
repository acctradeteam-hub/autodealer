name: commercial-proposal
version: 1.0.0
owner: maria
description: Коммерческое предложение по задаче клиента — подбор услуг, расчёт по прайсу, сроки, похожие кейсы
context: [clients, pricing, cases, templates]
roles: [sales, ceo]
input:
  type: object
  required: [client, task, deadline, language]
  properties:
    client: {type: string, title: Клиент}
    task: {type: string, title: Задача клиента, x-ui: textarea, minLength: 10}
    budget: {type: number, title: "Бюджет, ₽ (если известен)", minimum: 0}
    deadline: {type: string, title: Желаемый срок запуска, format: date}
    language: {type: string, title: Язык КП, enum: [ru, en], default: ru}
output:
  type: object
  required: [markdown, services, total_price, currency, timeline, cases, assumptions]
  properties:
    markdown: {type: string, description: Текст КП}
    services:
      type: array
      minItems: 1
      items:
        type: object
        required: [id, title, qty, unit_price, price]
        properties:
          id: {type: string}
          title: {type: string}
          qty: {type: integer, minimum: 1}
          unit: {type: string}
          unit_price: {type: number}
          price: {type: number}
          weeks: {type: number}
          reason: {type: string}
    total_price: {type: number, minimum: 0}
    currency: {type: string}
    timeline:
      type: object
      required: [start, end, weeks]
      properties:
        start: {type: string, format: date}
        end: {type: string, format: date}
        weeks: {type: integer}
        deadline: {type: [string, "null"]}
        fits_deadline: {type: [boolean, "null"]}
    cases:
      type: array
      items:
        type: object
        required: [id, title]
        properties:
          id: {type: string}
          title: {type: string}
          industry: {type: string}
    assumptions: {type: array, items: {type: string}}
