# Сборка приложения «Аукцион: заметки» (tools/android_voice) — .apk для Android.
# Готовый файл — в Releases репозитория (voice-app-N): скачать на телефон и установить.
name: Android voice app

on:
  push:
    paths:
      - "tools/android_voice/**"
      - ".github/workflows/android-voice.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      # Постоянный ключ подписи: без него каждая сборка подписана новым ключом, Android не ставит её поверх старой —
      # приложение приходилось удалять, и адрес Mac и токен в телефоне пропадали. Ключ создаётся один раз и хранится
      # в черновике релиза voice-app-key: черновики видны только тем, у кого есть право записи в репозиторий.
      - name: Signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KS=tools/android_voice/voice-app.keystore
          if gh release view voice-app-key > /dev/null 2> key_err.txt; then
            gh release download voice-app-key --pattern voice-app.keystore --dir tools/android_voice --clobber
            echo "ключ подписи: прежний"
          elif grep -qi "not found" key_err.txt; then
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android -alias voiceapp \
              -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Auction Notes, O=Lot Analyzer" > /dev/null
            gh release create voice-app-key "$KS" --draft --title "Ключ подписи приложения (не публиковать)" \
              --notes "Ключ подписи «Аукцион: заметки». Черновик не публиковать и не удалять: без него новая версия не встанет поверх старой."
            echo "ключ подписи: создан"
          else
            cat key_err.txt; exit 1
          fi
          test -s "$KS"
      - name: Build APK
        run: gradle -p tools/android_voice assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tools/android_voice/app/build/outputs/apk/debug/app-debug.apk auction-notes.apk
          gh release create "voice-app-${{ github.run_number }}" auction-notes.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "Аукцион: заметки (Android) — сборка ${{ github.run_number }}" \
            --notes "Скачайте auction-notes.apk на телефон Android и установите (разрешите установку из этого источника)."
