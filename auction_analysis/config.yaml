# Настройки разбора аукционов. Правьте под себя — скрипт читает этот файл при каждом запуске.

# Как ваша компания выглядит в лесенке ставок (часть имени, без учёта регистра) и ваши бейджи.
# Бейдж на каждом аукционе свой: впишите известные, остальные скрипт найдёт по имени.
us:
  names: [AUTOANTS]
  badges: []

# Конкуренты: часть имени, как оно пишется в лесенке ставок (без учёта регистра).
# «ONEAutoDeal» на аукционе выступает как «1 AUTO DEAL LLC» (подтверждено 10.11.2026).
competitors:
  ROMCAR: [ROMCAR]
  ONEAutoDeal: [1 AUTO DEAL, ONEAUTODEAL]
  AtlasAuto: [ATLAS AUTO, ATLASAUTO]
  SNB AutoGroup: [SNB AUTO, S N B AUTO, SNB]

# Ваш buy box. Основной сегмент — KBB Private Party до kbb_max;
# до kbb_stretch смотрим, если разница KBB − цена не меньше min_spread_stretch.
# Пока KBB по лоту нет, сегмент оценивается по цене продажи (price_max).
buy_box:
  kbb_max: 10000
  kbb_stretch: 15000
  min_spread_stretch: 5000
  price_max: 10000
  year_min:
  miles_max:
  max_road_miles:        # дальше этого расстояния от 92620 не везём
  makes: []              # например [Toyota, Honda, Lexus]
  models: []             # ваша таблица популярных моделей, например [Honda Civic, Toyota Camry]

# Пороги разбора
gap_minutes: 4           # пауза в записи ставок дольше этого при идущем лейне = дыра в данных
cheap_vs_median: 0.80    # «дёшево ушла»: цена ниже 80% медианы той же модели и года (±1)
min_peers: 3             # сколько похожих продаж нужно, чтобы считать медиану
top_n: 15
