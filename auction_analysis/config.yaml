# Настройки разбора аукционов. Правьте под себя — скрипт читает этот файл при каждом запуске.

# Как ваша компания выглядит в лесенке ставок (часть имени, без учёта регистра) и ваши бейджи.
# Бейдж на каждом аукционе свой: впишите известные, остальные скрипт найдёт по имени.
us:
  names: [AUTOANTS]
  badges: []

# Ваш buy box — какие машины вам интересны. Пустое значение = без ограничения.
# Пока не заполнено: разбор «интересных лотов» идёт по всем машинам.
buy_box:
  price_min:
  price_max:
  year_min:
  miles_max:
  max_road_miles:        # дальше этого расстояния от 92620 не везём
  makes: []              # например [Toyota, Honda, Lexus]

# Пороги разбора
gap_minutes: 4           # пауза в записи ставок дольше этого при идущем лейне = дыра в данных
cheap_vs_median: 0.80    # «дёшево ушла»: цена ниже 80% медианы той же модели и года (±1)
min_peers: 3             # сколько похожих продаж нужно, чтобы считать медиану
top_n: 15
